    <script>
      // Loading screen: covers the black screen while the build downloads and
      // starts. Fades out after the game starts, or 15 s after the download.
      function showProgress(instance, progress) {
        if (typeof UnityProgress === "function") UnityProgress(instance, progress);
        var fill = document.getElementById("sg-fill"), text = document.getElementById("sg-text");
        if (!fill || !text) return;
        var percent = Math.round(Math.min(progress, 1) * 100);
        fill.style.width = percent + "%";
        text.textContent = percent < 100 ? "Loading game… " + percent + "%" : "Starting game…";
        if (percent === 100 && !showProgress.fallback) showProgress.fallback = setTimeout(hideLoader, 15000);
      }
      function hideLoader() {
        var loader = document.getElementById("sg-loader");
        if (loader) loader.className = "done";
      }
      function gameStarted() { setTimeout(hideLoader, 1500); }
    </script>
