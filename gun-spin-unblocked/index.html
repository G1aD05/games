<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Gun Spin</title>
    <link rel="shortcut icon" href="style/favicon.ico" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #231f20; }
      .webgl-content, #gameContainer { width: 100%; height: 100%; }
      .footer { display: none; }
      #sg-loader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; background: #0b1440;
        color: #fff; font: 600 15px/1.4 system-ui, -apple-system, sans-serif; transition: opacity .4s; }
      #sg-loader.done { opacity: 0; pointer-events: none; }
      #sg-loader h1 { margin: 0; font-size: 34px; letter-spacing: 1px; }
      #sg-bar { width: min(320px, 70vw); height: 10px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
      #sg-fill { width: 0; height: 100%; border-radius: 99px; background: #ffc83d; transition: width .2s; }
      #sg-text { opacity: .75; font-weight: 500; }
    </style>
    <script src="UnityLoader.js"></script>
    <script src="UnityProgress.js"></script>
  </head>
  <body>
    <div id="sg-loader">
      <h1>GUN SPIN</h1>
      <div id="sg-bar"><div id="sg-fill"></div></div>
      <div id="sg-text">Loading game… 0%</div>
    </div>
    <div class="webgl-content">
      <div id="gameContainer"></div>
      <div class="footer">
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
      </div>
    </div>
    <script>
      function hideLoader() { document.getElementById("sg-loader").className = "done"; }
      function showProgress(instance, progress) {
        UnityProgress(instance, progress);
        var percent = Math.round(Math.min(progress, 1) * 100);
        document.getElementById("sg-fill").style.width = percent + "%";
        document.getElementById("sg-text").textContent = percent < 100 ? "Loading game… " + percent + "%" : "Starting game…";
        if (percent === 100 && !showProgress.fallback) showProgress.fallback = setTimeout(hideLoader, 15000);
      }
      var gameInstance = UnityLoader.instantiate("gameContainer", "build.json", {
        onProgress: showProgress,
        Module: {
          onRuntimeInitialized: function () { setTimeout(hideLoader, 1500); },
        },
      });
    </script>

</html>
